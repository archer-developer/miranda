<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="moonBody" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#2b1750"/>
      <stop offset="55%" stop-color="#160b2e"/>
      <stop offset="100%" stop-color="#08040f"/>
    </radialGradient>
    <linearGradient id="neon1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#7a5cff"/>
      <stop offset="100%" stop-color="#ff3ec8"/>
    </linearGradient>
    <linearGradient id="neon2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3ec8"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- moon body -->
  <circle cx="128" cy="128" r="112" fill="url(#moonBody)" stroke="url(#neon1)" stroke-width="3"/>

  <!-- Verona Rupes-style fault scarp -->
  <path d="M 40 175 Q 90 150 128 152 Q 175 155 205 110"
        fill="none" stroke="url(#neon2)" stroke-width="4" stroke-linecap="round"
        filter="url(#glow)" opacity="0.9"/>

  <!-- nested chevron coronae, Miranda's signature "racetrack" terrain -->
  <path d="M 70 70 L 128 118 L 186 70"
        fill="none" stroke="url(#neon1)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#glow)"/>
  <path d="M 85 95 L 128 130 L 171 95"
        fill="none" stroke="url(#neon1)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#glow)" opacity="0.85"/>
  <path d="M 98 118 L 128 142 L 158 118"
        fill="none" stroke="url(#neon1)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#glow)" opacity="0.7"/>

  <!-- crater dots -->
  <circle cx="165" cy="175" r="6" fill="none" stroke="url(#neon2)" stroke-width="2" filter="url(#glow)" opacity="0.8"/>
  <circle cx="185" cy="150" r="3.5" fill="none" stroke="url(#neon2)" stroke-width="1.5" filter="url(#glow)" opacity="0.7"/>
</svg>
