<!doctype html>
<html lang="{{.Lang}}" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{.Strings.login_title}} — Miranda</title>
  <link rel="icon" type="image/svg+xml" href="/static/v{{.AssetVersion}}/brand/icon.svg" />
  <link rel="alternate icon" type="image/png" href="/static/v{{.AssetVersion}}/brand/icon.png" />
  <link rel="stylesheet" href="/static/v{{.AssetVersion}}/css/styles.css" />
</head>
<body class="flex h-full items-center justify-center bg-slate-950 text-slate-100 antialiased">
  <div class="w-full max-w-sm rounded-lg border border-slate-800 bg-slate-900/50 p-6">
    <div class="mb-6 flex flex-col items-center gap-2">
      <img src="/static/v{{.AssetVersion}}/brand/icon.svg" alt="" class="h-14 w-14" />
      <h1 class="text-lg font-semibold tracking-tight">{{.Strings.login_title}}</h1>
    </div>

    {{if .Error}}
    <div class="mb-4 rounded-md border border-red-900 bg-red-950/50 px-3 py-2 text-sm text-red-300">
      {{.Strings.login_error}}
    </div>
    {{end}}

    <form method="POST" action="/login" class="space-y-3">
      <div>
        <label class="mb-1 block text-xs text-slate-400" for="username">{{.Strings.login_username_label}}</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus
               class="w-full rounded-md border border-slate-700 bg-slate-950 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none" />
      </div>
      <div>
        <label class="mb-1 block text-xs text-slate-400" for="password">{{.Strings.login_password_label}}</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required
               class="w-full rounded-md border border-slate-700 bg-slate-950 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none" />
      </div>
      <button type="submit"
              class="w-full rounded-md bg-indigo-500 px-3 py-2 text-sm font-medium text-white hover:bg-indigo-400 active:bg-indigo-600">
        {{.Strings.login_button}}
      </button>
    </form>

    {{if .WebAuthnEnabled}}
    <button id="biometric-login" type="button" hidden
            class="mt-3 w-full rounded-md border border-slate-700 px-3 py-2 text-sm font-medium text-slate-200 hover:bg-slate-800">
      {{.Strings.login_biometric_button}}
    </button>
    <p id="biometric-error" class="mt-2 hidden text-center text-xs text-red-400"></p>
    {{end}}

    <div class="mt-5 flex justify-center gap-3 text-xs text-slate-500">
      {{range .Languages}}
      <a href="/set-lang?lang={{.Code}}&next=/login" class="{{if .Active}}text-slate-200{{else}}hover:text-slate-300{{end}}">{{.Label}}</a>
      {{end}}
    </div>
  </div>

  {{if .WebAuthnEnabled}}
  <script>window.MIRANDA_I18N = {{.StringsJSON}};</script>
  <script type="module" src="/static/v{{.AssetVersion}}/js/login.js"></script>
  {{end}}
</body>
</html>
