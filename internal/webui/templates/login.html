<!doctype html>
<html lang="{{.Lang}}" class="h-full">
<head>
  <meta charset="utf-8" />
  <!-- viewport-fit=cover: see index.html's copy of this tag — needed so
       env(safe-area-inset-*) resolves to a real inset in the installed PWA
       instead of 0. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>{{.Strings.login_title}} — Miranda</title>
  <meta name="theme-color" id="theme-color-meta" content="#f8fafc" />
  <script>
    // Sets the .dark class on <html>, and the theme-color meta tag above,
    // synchronously before the stylesheet below even starts loading, so the
    // page (and the browser chrome's own color) never flashes the wrong
    // theme for a split second. Deliberately not an ES module (those are
    // always deferred) and duplicated in index.html (see that template)
    // since the two pages don't share a layout. Keep STORAGE_KEY and the
    // two hex colors in sync with static/js/theme.js's THEME_COLORS by hand
    // if either ever changes.
    (function () {
      try {
        var STORAGE_KEY = "miranda-theme";
        var stored = localStorage.getItem(STORAGE_KEY);
        var dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
        document.getElementById("theme-color-meta").content = dark ? "#160b2e" : "#f8fafc";
      } catch (e) {
        /* Storage/matchMedia can throw in restricted contexts; falling
           through leaves the light theme (the unconditional default). */
      }
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/static/v{{.AssetVersion}}/brand/icon.svg" />
  <link rel="alternate icon" type="image/png" href="/static/v{{.AssetVersion}}/brand/icon.png" />
  <link rel="stylesheet" href="/static/v{{.AssetVersion}}/css/styles.css" />

  <!-- PWA: same install metadata as index.html (see that template for why
       the manifest URL itself is unversioned) — the login page is a valid
       PWA entry point for a logged-out user. -->
  <link rel="manifest" href="/static/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/static/v{{.AssetVersion}}/brand/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Miranda" />
  <meta name="mobile-web-app-capable" content="yes" />
</head>
<body class="flex min-h-full items-center justify-center bg-(--color-bg) px-4 py-8 text-(--color-text) antialiased">
  <!-- No overflow-hidden here: the decorative glow below is `fixed`, so it
       never contributes to the page's scrollable area — and a short
       viewport (e.g. a landscape phone with the keyboard open) must still
       be able to scroll to reach the submit button. -->
  <!-- A single, very restrained radial glow behind the card — the persona
       doc warns against heavy gradients, so this stays low-opacity and
       purely atmospheric, not a design element anyone should consciously
       notice. aria-hidden since it's decorative only. Opacity is
       deliberately the same 10% in both themes: over the dark surface it
       reads as a faint indigo bloom (the original effect); over the light
       surface that same low opacity keeps it a barely-there tint instead
       of a muddy smear — a stronger value looked murky against white in
       review. -->
  <div aria-hidden="true"
       class="pointer-events-none fixed left-1/2 top-1/3 h-[36rem] w-[36rem] -translate-x-1/2 -translate-y-1/2 rounded-full bg-(--color-accent)/10 blur-3xl"></div>

  <!-- top-[calc(env(safe-area-inset-top)+1rem)]: same viewport-fit=cover
       reasoning as index.html's header — this button is `fixed`, so it's
       just as exposed to sitting under the notch/status bar as a sticky
       header would be. -->
  <button id="theme-toggle" type="button"
          class="fixed right-4 top-[calc(env(safe-area-inset-top)+1rem)] z-10 inline-flex h-11 w-11 items-center justify-center rounded-lg text-(--color-text-muted) transition-colors hover:bg-(--color-surface-2) hover:text-(--color-text) focus-visible:outline-none">
  </button>

  <main class="relative w-full max-w-sm animate-scale-in">
    <div class="rounded-2xl border border-(--color-border) bg-(--color-surface)/60 p-8 shadow-2xl shadow-black/10 backdrop-blur">
      <div class="mb-8 flex flex-col items-center gap-3 text-center">
        <img src="/static/v{{.AssetVersion}}/brand/icon.svg" alt="" class="h-12 w-12 rounded-full ring-2 ring-(--color-border-strong)" />
        <h1 class="text-xl font-semibold tracking-tight text-(--color-text)">{{.Strings.login_title}}</h1>
      </div>

      {{if .Error}}
      <div role="alert" class="mb-5 flex items-start gap-2.5 rounded-lg border border-(--color-danger-border) bg-(--color-danger-bg) px-3.5 py-3 text-sm text-(--color-danger-text)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mt-0.5 h-4 w-4 shrink-0" aria-hidden="true"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16" x2="12" y2="16.01"/></svg>
        <span>{{.Strings.login_error}}</span>
      </div>
      {{end}}

      <form method="POST" action="/login" class="space-y-4" novalidate>
        <div>
          <label class="mb-1.5 block text-xs font-medium text-(--color-text-muted)" for="username">{{.Strings.login_username_label}}</label>
          <input id="username" name="username" type="text" autocomplete="username" required autofocus
                 class="w-full rounded-lg border border-(--color-border-strong) bg-(--color-bg) px-3.5 py-2.5 text-sm text-(--color-text) transition-colors placeholder:text-(--color-text-faint) hover:border-(--color-text-faint) focus:border-(--color-accent-emphasis) focus:outline-none focus-visible:outline-none" />
        </div>
        <div>
          <label class="mb-1.5 block text-xs font-medium text-(--color-text-muted)" for="password">{{.Strings.login_password_label}}</label>
          <div class="relative">
            <input id="password" name="password" type="password" autocomplete="current-password" required
                   class="w-full rounded-lg border border-(--color-border-strong) bg-(--color-bg) px-3.5 py-2.5 pr-11 text-sm text-(--color-text) transition-colors placeholder:text-(--color-text-faint) hover:border-(--color-text-faint) focus:border-(--color-accent-emphasis) focus:outline-none focus-visible:outline-none" />
            <button type="button" id="password-toggle" tabindex="0"
                    class="absolute inset-y-0 right-0 flex w-11 items-center justify-center text-(--color-text-faint) transition-colors hover:text-(--color-text-muted) focus-visible:outline-none"
                    aria-label="{{.Strings.login_password_show}}" aria-pressed="false">
              <svg id="password-toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" id="login-submit"
                class="flex w-full items-center justify-center gap-2 rounded-lg bg-(--color-accent) px-3.5 py-2.5 text-sm font-medium text-white transition-colors hover:bg-(--color-accent-hover) focus-visible:outline-none active:bg-(--color-accent-active)">
          {{.Strings.login_button}}
        </button>
      </form>

      {{if .WebAuthnEnabled}}
      <div class="my-5 flex items-center gap-3 text-xs text-(--color-text-faint)">
        <span class="h-px flex-1 bg-(--color-border)"></span>
        {{.Strings.login_or_divider}}
        <span class="h-px flex-1 bg-(--color-border)"></span>
      </div>

      <button id="biometric-login" type="button" hidden
              class="flex w-full items-center justify-center gap-2 rounded-lg border border-(--color-border-strong) px-3.5 py-2.5 text-sm font-medium text-(--color-text) transition-colors hover:border-(--color-text-faint) hover:bg-(--color-surface-2)/60 focus-visible:outline-none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4" aria-hidden="true"><circle cx="7" cy="15" r="4"/><path d="M9.5 12.5 20 2"/><path d="M17 5l3 3"/><path d="M14 8l2.5 2.5"/></svg>
        {{.Strings.login_biometric_button}}
      </button>
      <p id="biometric-error" role="alert" class="mt-3 hidden text-center text-xs text-(--color-danger-icon)"></p>
      {{end}}
    </div>

    <div class="mt-6 flex justify-center gap-4 text-xs text-(--color-text-faint)">
      {{range .Languages}}
      <a href="/set-lang?lang={{.Code}}&next=/login" class="font-medium transition-colors {{if .Active}}text-(--color-text-muted){{else}}hover:text-(--color-text-muted){{end}}">{{.Label}}</a>
      {{end}}
    </div>
  </main>

  <script>
    // Password visibility toggle. Deliberately not an ES module: it's a
    // single trivial interaction with no dependency on i18n.js/webauthn.js,
    // and (unlike login.js) needs to run whether or not WebAuthn is
    // enabled, so it can't live behind that template guard.
    (function () {
      var input = document.getElementById("password");
      var toggle = document.getElementById("password-toggle");
      var icon = document.getElementById("password-toggle-icon");
      var showLabel = "{{.Strings.login_password_show}}";
      var hideLabel = "{{.Strings.login_password_hide}}";
      var eyeOff = '<path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61C3.35 8.36 1 12 1 12s4 7 11 7a9.26 9.26 0 0 0 5.39-1.61"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
      var eyeOn = '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>';
      toggle.addEventListener("click", function () {
        var show = input.type === "password";
        input.type = show ? "text" : "password";
        icon.innerHTML = show ? eyeOff : eyeOn;
        toggle.setAttribute("aria-pressed", String(show));
        toggle.setAttribute("aria-label", show ? hideLabel : showLabel);
      });
    })();
  </script>

  <script>window.MIRANDA_I18N = {{.StringsJSON}};</script>
  <script type="module">
    // Wires the theme toggle unconditionally (unlike login.js below, which
    // only loads when WebAuthn is enabled) — the toggle itself has nothing
    // to do with passkeys and must work on every login page.
    import { init } from "/static/v{{.AssetVersion}}/js/theme.js";
    init(document.getElementById("theme-toggle"));
  </script>

  {{if .WebAuthnEnabled}}
  <script type="module" src="/static/v{{.AssetVersion}}/js/login.js"></script>
  {{end}}
</body>
</html>
