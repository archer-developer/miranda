<!doctype html>
<html lang="{{.Lang}}" class="h-full overflow-hidden">
<head>
  <meta charset="utf-8" />
  <!-- viewport-fit=cover: lets the page extend under the iOS notch/home-
       indicator instead of Safari letterboxing it there, which is what
       makes the env(safe-area-inset-*) values below resolve to the real
       inset instead of 0 — without this, a PWA's own fixed-bottom UI (the
       chat composer, see styles.css) sits flush against the home indicator
       when launched standalone. maximum-scale=1/user-scalable=no disable
       pinch-zoom — a deliberate accessibility trade-off (some users rely on
       pinch-zoom for readability), requested because it kept getting
       triggered by accident on a touch UI this dense. -->
  <!-- interactive-widget=resizes-content (Chrome/Firefox; ignored elsewhere):
       makes the *layout* viewport itself shrink when the on-screen keyboard
       opens, instead of only the visual viewport (the default
       resizes-visual). Where it's honored, 100dvh and the --app-height sync
       below end up agreeing already, so this doesn't change behavior there
       — it's a no-JS head start for browsers that support it. Safari
       doesn't implement this property at all (WebKit bug 259770, still
       open); screens/chat.js's sticky #chat-composer is what makes the
       keyboard case work correctly there. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Miranda</title>
  <meta name="theme-color" id="theme-color-meta" content="#f8fafc" />
  <script>
    // Capture beforeinstallprompt synchronously before any deferred module
    // scripts run — the event can fire during page load, and ES modules execute
    // after parsing, so without this early listener it would be missed. pwa.js
    // reads window._pwaPrompt to pick it up.
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window._pwaPrompt = e;
    });
  </script>
  <script>
    // Sets the .dark class on <html>, and the theme-color meta tag above,
    // synchronously before the stylesheet below even starts loading, so the
    // page (and the browser chrome's own color) never flashes the wrong
    // theme for a split second. Deliberately not an ES module (those are
    // always deferred) and duplicated in login.html (see that template)
    // since the two pages don't share a layout. Keep STORAGE_KEY and the
    // two hex colors in sync with static/js/theme.js's THEME_COLORS by hand
    // if either ever changes.
    (function () {
      try {
        var STORAGE_KEY = "miranda-theme";
        var stored = localStorage.getItem(STORAGE_KEY);
        var dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
        document.getElementById("theme-color-meta").content = dark ? "#160b2e" : "#f8fafc";
      } catch (e) {
        /* Storage/matchMedia can throw in restricted contexts; falling
           through leaves the light theme (the unconditional default). */
      }
    })();
  </script>
  <script>
    // Mirrors the *actual* visible viewport height into --app-height, used
    // by <body> below instead of 100dvh. 100dvh is spec'd to track
    // browser-chrome-driven size changes (the URL bar hiding/showing), but
    // this app also runs `display: standalone` (manifest.webmanifest) with
    // viewport-fit=cover, which lets content draw edge-to-edge under
    // Android's system status/gesture bars. On several Android browsers
    // (confirmed on a Vivo device) 100dvh in that mode resolves to the full
    // screen height *including* the area behind the gesture bar, without a
    // working env(safe-area-inset-bottom) to compensate the way iOS Safari
    // does — so a body sized with 100dvh rendered its last flex child (the
    // chat composer, see screens/chat.js) partly or fully behind the
    // gesture bar, unreachable. window.visualViewport.height is the one
    // signal that reflects the true visible/tappable area across browsers,
    // so it's synced here — on load, on its own resize (covers on-screen
    // keyboard and gesture-bar show/hide), and on orientationchange — and
    // consumed via the CSS var(), with 100dvh kept as the pre-JS/no-JS
    // fallback. Deliberately not an ES module for the same reason as the
    // theme script above: needs to run before first paint.
    (function () {
      var root = document.documentElement;
      function sync() {
        var vv = window.visualViewport;
        root.style.setProperty("--app-height", (vv ? vv.height : window.innerHeight) + "px");
      }
      sync();
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", sync);
      } else {
        window.addEventListener("resize", sync);
      }
      window.addEventListener("orientationchange", sync);

      // Cancels the actual document scroll iOS forces when a focused input
      // (the chat composer's textarea) would otherwise sit under the
      // keyboard: confirmed on-device that this is a real window.scrollY
      // change, not just visual-viewport panning (a position:fixed debug
      // marker scrolled off the top of the screen when the keyboard
      // opened), and html/body's overflow-hidden (see <body>'s own
      // comment) does nothing to stop it — that CSS lock only blocks
      // user-gesture/programmatic scrolling, not this native
      // scroll-into-view behavior, which operates beneath it. Once
      // window.scrollY is forced back to 0, the shell (sized to
      // --app-height, i.e. the actual visible area above the keyboard)
      // stays exactly where it was laid out, with nothing left to scroll
      // it out from under itself.
      function resetScroll() {
        if (window.scrollX !== 0 || window.scrollY !== 0) window.scrollTo(0, 0);
      }
      window.addEventListener("scroll", resetScroll, { passive: true });
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", resetScroll);
        window.visualViewport.addEventListener("scroll", resetScroll);
      }
      // The forced scroll can happen a moment after focus (keyboard
      // open animation), so a single synchronous reset on the focus event
      // itself isn't enough — these catch it once iOS has actually settled.
      document.addEventListener(
        "focusin",
        function () {
          resetScroll();
          setTimeout(resetScroll, 50);
          setTimeout(resetScroll, 150);
          setTimeout(resetScroll, 350);
        },
        true,
      );
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/static/v{{.AssetVersion}}/brand/icon.svg" />
  <link rel="alternate icon" type="image/png" href="/static/v{{.AssetVersion}}/brand/icon.png" />
  <link rel="stylesheet" href="/static/v{{.AssetVersion}}/css/styles.css" />

  <!-- PWA: install metadata. manifest.webmanifest itself is served at a
       fixed, unversioned URL (see webui.go's handleManifest) — an
       already-installed home-screen shortcut has no page load to pick up a
       new versioned URL after a future deploy, so the manifest's own
       address must never change. Its icon URLs inside are still versioned,
       so a rebuild still cache-busts them like every other static asset. -->
  <link rel="manifest" href="/static/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/static/v{{.AssetVersion}}/brand/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Miranda" />
  <meta name="mobile-web-app-capable" content="yes" />
</head>
<!-- Height: var(--app-height, 100dvh), not a plain h-dvh class — see the
     --app-height sync script in <head>. Two independent mobile quirks are
     stacked on top of each other here, both a consequence of this app
     running `display: standalone` (manifest.webmanifest) with
     viewport-fit=cover, i.e. content drawing edge-to-edge under the OS
     status/gesture bars:

     1. WKWebView (iOS standalone): the percentage-height chain
        (html{height:100%} -> body{height:100%} -> the flex div below)
        resolves against a containing block that's short by exactly the top
        safe-area inset — a real WebKit quirk that left the composer's own
        bottom safe-area padding correct but sitting on top of an extra
        unstyled gap the height of the *top* inset, since the whole column
        of content (header+main) was that much too short. 100dvh, being
        tied directly to the actual visual viewport rather than propagated
        through ancestor percentages, doesn't have that gap — which is why
        this isn't simply h-full.

     2. Several Android browsers (confirmed on a Vivo device): 100dvh
        itself resolves to the full screen height *including* the area
        behind the bottom gesture bar, without a working
        env(safe-area-inset-bottom) to compensate the way iOS Safari does.
        A body sized with plain 100dvh therefore rendered its last flex
        child — the chat composer, see screens/chat.js — partly or fully
        behind the gesture bar: unreachable, not just visually clipped.
        window.visualViewport.height is the one signal that reflects the
        true visible/tappable area on that browser too, so the <head>
        script mirrors it into --app-height live (initial load, its own
        resize, orientationchange) and this consumes that instead, keeping
        100dvh only as the pre-JS/no-JS fallback.

     overflow-hidden (here and on <html> above) is a separate, load-bearing
     fix for a third Android-only quirk: Chrome's dynamic toolbar (the URL
     bar) hides and shows based on scroll of the *document*, and each
     show/hide changes what 100dvh resolves to. Every inner pane that
     actually needs to scroll (chat-scroll, the logs/history panes, …) is
     already scoped with its own overflow-y-auto, so the document itself
     never needs to scroll — but without an explicit overflow-hidden here, a
     stray 1px of overflow (rounding, a mid-resize frame) was enough to let
     the document scroll too. That let the toolbar hide, which grew 100dvh,
     which shrank the previous scroll offset back into view, which let the
     toolbar reappear — an infinite resize/scroll loop that alternately
     covered the header and the composer with the browser's own chrome.
     Locking the document to never scroll removes that feedback loop
     entirely, independent of the --app-height fix above (which addresses
     the gesture bar, not the URL bar). iOS Safari/WKWebView has neither a
     scroll-driven toolbar nor this gesture-bar inset bug, so both of these
     are no-ops there.

     A third, on-screen-keyboard gap took two wrong turns before landing on
     the real cause. First tried as a body-level fix (position: fixed;
     inset: 0 on <body>): made it worse on real iOS, since fixed
     positioning doesn't reliably track whatever WebKit was doing there.
     Second, suspecting the composer just needed a local scrollable
     ancestor to satisfy the keyboard's "scroll into view" with (see
     screens/chat.js's #chat-composer history — it's sticky inside
     #chat-scroll for unrelated, still-valid reasons: it's the standard way
     to keep a composer glued to the bottom of a scrolling thread), but the
     gap persisted identically — proof this was never about the composer's
     position at all. An on-device debug overlay (a position: fixed marker
     that visibly scrolled off the top of the screen when the keyboard
     opened) confirmed the actual cause: iOS was forcing a real
     window.scrollY change to bring the focused textarea into view, and
     this overflow-hidden lock does nothing to stop it — it only blocks
     user-gesture/programmatic scrolling, not this native
     scroll-into-view behavior, which operates beneath it. The real fix is
     the 'resetScroll' listener in the <head> script above, which forces
     window.scrollY back to 0 on every scroll/resize/focusin — once
     nothing is left to scroll the page, the shell (already correctly
     sized to --app-height, the true visible area above the keyboard)
     just stays where it was laid out. -->
<body class="overflow-hidden bg-(--color-bg) text-(--color-text) antialiased" style="height: var(--app-height, 100dvh)">
  <a href="#app" class="sr-only focus-visible:not-sr-only focus-visible:fixed focus-visible:left-4 focus-visible:top-4 focus-visible:z-50 focus-visible:rounded-lg focus-visible:bg-(--color-accent) focus-visible:px-4 focus-visible:py-2 focus-visible:text-sm focus-visible:font-medium focus-visible:text-white">
    {{.Strings.skip_to_content}}
  </a>

  <div class="flex h-full flex-col">
    <!-- pt-[env(safe-area-inset-top)]: same reasoning as the composer's
         bottom safe-area padding in screens/chat.js, but for the
         other edge — viewport-fit=cover (index.html's <head>) makes the
         whole document draw under the iOS status bar/notch in a standalone
         PWA, not just the home-indicator area at the bottom, so the header
         needs its own inset or its content sits behind the notch. Padding
         (not margin) so the header's own background/blur still fills the
         notch area instead of leaving it showing the page background. -->
    <header class="relative z-40 border-b border-(--color-border) bg-(--color-bg)/80 pt-[env(safe-area-inset-top)] backdrop-blur supports-[backdrop-filter]:bg-(--color-bg)/60">
      <div class="mx-auto flex max-w-7xl items-center justify-between gap-3 px-4 py-3 sm:px-6">
        <a href="#/chat" class="flex items-center gap-2.5 rounded-lg py-1 transition-opacity hover:opacity-80">
          <img src="/static/v{{.AssetVersion}}/brand/icon.svg" alt="" class="h-8 w-8 rounded-full ring-2 ring-(--color-border-strong)" />
          <span class="text-base font-semibold tracking-tight text-(--color-text)">Miranda</span>
        </a>

        <nav id="nav-links" aria-label="{{.Strings.nav_primary_label}}" class="hidden items-center gap-1 text-sm sm:flex"></nav>

        <div class="flex items-center gap-2 sm:gap-3">
          <div class="flex items-center gap-2 rounded-full border border-(--color-border) bg-(--color-surface)/40 px-2.5 py-1.5 sm:px-3">
            <span id="ws-dot" class="h-2 w-2 shrink-0 animate-pulse-soft rounded-full bg-(--color-text-faint)" title="{{.Strings.ws_connecting}}"></span>
            <span id="ws-status" class="hidden text-xs font-medium text-(--color-text-muted) md:inline">{{.Strings.ws_connecting}}</span>
          </div>

          <div class="hidden items-center gap-0.5 rounded-full border border-(--color-border) bg-(--color-surface)/40 p-0.5 text-xs lg:flex">
            {{range .Languages}}
            <a href="/set-lang?lang={{.Code}}&next=/" class="rounded-full px-2.5 py-1 font-medium transition-colors {{if .Active}}bg-(--color-surface-2) text-(--color-text){{else}}text-(--color-text-faint) hover:text-(--color-text-muted){{end}}">{{.Label}}</a>
            {{end}}
          </div>

          <button id="theme-toggle" type="button"
                  class="inline-flex h-11 w-11 items-center justify-center rounded-lg text-(--color-text-muted) transition-colors hover:bg-(--color-surface-2) hover:text-(--color-text) focus-visible:outline-none">
          </button>

          <a href="#/profile" class="hidden min-h-11 items-center gap-2 rounded-full pl-1 pr-3 text-sm transition-colors hover:bg-(--color-surface-2) sm:flex">
            {{if .User.Avatar}}
            <img src="{{.User.Avatar}}" alt="" class="h-7 w-7 rounded-full object-cover ring-1 ring-(--color-border)" />
            {{else}}
            <span class="flex h-7 w-7 items-center justify-center rounded-full bg-(--color-surface-2) text-(--color-text-faint)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
            </span>
            {{end}}
            <span class="font-medium text-(--color-text)">{{.User.DisplayName}}</span>
          </a>

          <button id="nav-burger" type="button"
                  class="inline-flex h-11 w-11 items-center justify-center rounded-lg text-(--color-text-muted) transition-colors hover:bg-(--color-surface-2) hover:text-(--color-text) focus-visible:outline-none sm:hidden"
                  aria-label="{{.Strings.nav_menu_toggle}}" aria-expanded="false" aria-controls="nav-drawer">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5">
              <path d="M3.75 6.75h16.5M3.75 12h16.5M3.75 17.25h16.5" />
            </svg>
          </button>
        </div>
      </div>

      <div id="nav-drawer"
           class="drawer-closed absolute inset-x-0 top-full flex origin-top flex-col gap-4 border-b border-(--color-border) bg-(--color-bg)/95 p-4 shadow-xl shadow-black/10 backdrop-blur transition-[opacity,transform] duration-200 ease-out sm:hidden"
           role="menu" aria-hidden="true">
        <nav id="nav-links-mobile" aria-label="{{.Strings.nav_primary_label}}" class="flex flex-col gap-1 text-sm"></nav>
        <div class="flex items-center gap-4 border-t border-(--color-border) pt-4 text-xs text-(--color-text-faint)">
          {{range .Languages}}
          <a href="/set-lang?lang={{.Code}}&next=/" class="font-medium {{if .Active}}text-(--color-text){{else}}hover:text-(--color-text-muted){{end}}">{{.Label}}</a>
          {{end}}
        </div>
        <form method="POST" action="/logout">
          <button type="submit" class="flex w-full items-center gap-2 rounded-lg border border-(--color-border) px-3 py-2.5 text-left text-sm font-medium text-(--color-text-muted) transition-colors hover:border-(--color-danger-border) hover:bg-(--color-danger-bg) hover:text-(--color-danger-text)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            {{.Strings.logout_button}}
          </button>
        </form>
      </div>
    </header>

    <!-- PWA install banner. Hidden by default; pwa.js reveals it when
         beforeinstallprompt fires (Chrome/Edge on Android, desktop Chrome).
         Sits between the header and the app content so it participates in
         the flex layout and naturally pushes <main> down instead of
         overlapping any fixed-position UI. -->
    <div id="pwa-install-banner" hidden>
      <img src="/static/v{{.AssetVersion}}/brand/icon.svg" alt="" class="pwa-banner-icon" />
      <span class="pwa-banner-text">{{.Strings.pwa_install_banner}}</span>
      <button id="pwa-install-btn" type="button" class="pwa-banner-install">
        {{.Strings.pwa_install_button}}
      </button>
      <button id="pwa-install-dismiss" type="button" aria-label="{{.Strings.pwa_install_dismiss}}"
              class="pwa-banner-dismiss">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <main id="app" tabindex="-1" class="min-h-0 flex-1 overflow-hidden focus:outline-none"></main>
  </div>

  <!-- Shown by the portrait-only CSS lock (input.css) when a phone is
       rotated to landscape. Invisible on tablets and desktops. -->
  <div id="rotate-overlay" aria-hidden="true">
    <!-- Phone-rotate icon: a landscape phone outline with a curved arrow -->
    <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
      <path d="M12 3v2"/>
      <path d="M10 3h4"/>
      <path d="M8.5 1.5A9.5 9.5 0 0 0 3 9"/>
      <path d="M3 6v3h3"/>
    </svg>
    <span style="font-size:0.9rem">{{.Strings.rotate_to_portrait}}</span>
  </div>

  <script>
    window.MIRANDA_I18N = {{.StringsJSON}};
    window.MIRANDA_USER = {{.UserJSON}};
    window.MIRANDA_WEBAUTHN_ENABLED = {{.WebAuthnEnabled}};
  </script>
  <!-- Attempt the Screen Orientation API lock for browsers that support it
       (Chrome on Android). Silently ignored on iOS Safari and non-fullscreen
       contexts where the API is unavailable or restricted. The CSS overlay
       above acts as the universal fallback. -->
  <script>
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('portrait-primary').catch(function () {});
    }
  </script>
  <script type="module" src="/static/v{{.AssetVersion}}/js/app.js"></script>
</body>
</html>
