<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Miranda</title>
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body class="h-full bg-slate-950 text-slate-100 antialiased">
  <div class="flex h-full flex-col">
    <header class="flex items-center justify-between border-b border-slate-800 px-4 py-3 sm:px-6">
      <div class="flex items-center gap-2">
        <span class="text-lg font-semibold tracking-tight">Miranda</span>
        <span class="rounded-full bg-slate-800 px-2 py-0.5 text-xs text-slate-400">agent monitor</span>
      </div>
      <div class="flex items-center gap-2 text-sm">
        <span id="ws-dot" class="h-2.5 w-2.5 rounded-full bg-slate-600"></span>
        <span id="ws-status" class="text-slate-400">connecting…</span>
      </div>
    </header>

    <main class="grid flex-1 grid-cols-1 gap-4 overflow-hidden p-4 sm:p-6 lg:grid-cols-[1fr_380px]">
      <!-- Live log -->
      <section class="flex min-h-0 flex-col rounded-lg border border-slate-800 bg-slate-900/50">
        <div class="border-b border-slate-800 px-4 py-2 text-sm font-medium text-slate-300">Live log</div>
        <div id="log" class="flex-1 space-y-1 overflow-y-auto p-4 font-mono text-xs leading-relaxed"></div>
      </section>

      <!-- Sidebar: debug input + dialog browser -->
      <aside class="flex min-h-0 flex-col gap-4 overflow-y-auto">
        <section class="rounded-lg border border-slate-800 bg-slate-900/50 p-4">
          <h2 class="mb-3 text-sm font-medium text-slate-300">Send a command</h2>
          <form id="debug-form" class="space-y-2">
            <input id="debug-user" type="text" placeholder="user_id (optional)"
                   class="w-full rounded-md border border-slate-700 bg-slate-950 px-3 py-2 text-sm placeholder:text-slate-500 focus:border-slate-500 focus:outline-none" />
            <textarea id="debug-text" rows="3" placeholder="Type a message…" required
                      class="w-full resize-none rounded-md border border-slate-700 bg-slate-950 px-3 py-2 text-sm placeholder:text-slate-500 focus:border-slate-500 focus:outline-none"></textarea>
            <input id="debug-token" type="password" placeholder="Bearer token (if configured)"
                   class="w-full rounded-md border border-slate-700 bg-slate-950 px-3 py-2 text-sm placeholder:text-slate-500 focus:border-slate-500 focus:outline-none" />
            <button type="submit"
                    class="w-full rounded-md bg-indigo-500 px-3 py-2 text-sm font-medium text-white hover:bg-indigo-400 active:bg-indigo-600">
              Send
            </button>
          </form>
          <div id="debug-reply" class="mt-3 hidden rounded-md border border-slate-800 bg-slate-950 p-3 text-sm text-slate-200"></div>
        </section>

        <section class="flex min-h-0 flex-1 flex-col rounded-lg border border-slate-800 bg-slate-900/50 p-4">
          <h2 class="mb-3 text-sm font-medium text-slate-300">Dialog history</h2>
          <div class="mb-2 flex gap-2">
            <input id="dialogs-user" type="text" placeholder="user_id"
                   class="flex-1 rounded-md border border-slate-700 bg-slate-950 px-3 py-2 text-sm placeholder:text-slate-500 focus:border-slate-500 focus:outline-none" />
            <button id="dialogs-load"
                    class="rounded-md border border-slate-700 px-3 py-2 text-sm text-slate-200 hover:bg-slate-800">
              Load
            </button>
          </div>
          <div id="dialogs-list" class="flex-1 space-y-2 overflow-y-auto text-sm text-slate-300"></div>
        </section>
      </aside>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
