<!doctype html>
<html lang="{{.Lang}}" class="h-full">
<head>
  <meta charset="utf-8" />
  <!-- viewport-fit=cover: lets the page extend under the iOS notch/home-
       indicator instead of Safari letterboxing it there, which is what
       makes the env(safe-area-inset-*) values below resolve to the real
       inset instead of 0 — without this, a PWA's own fixed-bottom UI (the
       chat composer, see styles.css) sits flush against the home indicator
       when launched standalone. maximum-scale=1/user-scalable=no disable
       pinch-zoom — a deliberate accessibility trade-off (some users rely on
       pinch-zoom for readability), requested because it kept getting
       triggered by accident on a touch UI this dense. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Miranda</title>
  <meta name="theme-color" id="theme-color-meta" content="#f8fafc" />
  <script>
    // Sets the .dark class on <html>, and the theme-color meta tag above,
    // synchronously before the stylesheet below even starts loading, so the
    // page (and the browser chrome's own color) never flashes the wrong
    // theme for a split second. Deliberately not an ES module (those are
    // always deferred) and duplicated in login.html (see that template)
    // since the two pages don't share a layout. Keep STORAGE_KEY and the
    // two hex colors in sync with static/js/theme.js's THEME_COLORS by hand
    // if either ever changes.
    (function () {
      try {
        var STORAGE_KEY = "miranda-theme";
        var stored = localStorage.getItem(STORAGE_KEY);
        var dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
        document.getElementById("theme-color-meta").content = dark ? "#160b2e" : "#f8fafc";
      } catch (e) {
        /* Storage/matchMedia can throw in restricted contexts; falling
           through leaves the light theme (the unconditional default). */
      }
    })();
  </script>
  <script>
    // Sets --app-height on <html> to the real, current viewport height,
    // synchronously before first paint — a workaround for a WKWebView
    // standalone-PWA quirk where window.innerHeight/visualViewport.height
    // (and, transitively, the 100dvh the <body> below falls back to before
    // this runs) report a too-short value on cold launch that only
    // self-corrects after the *next* layout pass, which in practice only
    // happened once the user scrolled — leaving the composer sitting on an
    // unstyled gap the height of the shortfall until then. Re-measuring on
    // resize/scroll/visualViewport events keeps it correct after; the
    // rAF/timeout re-measures below catch WebKit's own self-correction
    // without waiting on the user to trigger it via a scroll gesture.
    (function () {
      function setAppHeight() {
        var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
        document.documentElement.style.setProperty("--app-height", h + "px");
      }
      setAppHeight();
      ["resize", "orientationchange", "scroll"].forEach(function (evt) {
        window.addEventListener(evt, setAppHeight, { passive: true });
      });
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", setAppHeight);
        window.visualViewport.addEventListener("scroll", setAppHeight);
      }
      requestAnimationFrame(setAppHeight);
      setTimeout(setAppHeight, 300);
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/static/v{{.AssetVersion}}/brand/icon.svg" />
  <link rel="alternate icon" type="image/png" href="/static/v{{.AssetVersion}}/brand/icon.png" />
  <link rel="stylesheet" href="/static/v{{.AssetVersion}}/css/styles.css" />

  <!-- PWA: install metadata. manifest.webmanifest itself is served at a
       fixed, unversioned URL (see webui.go's handleManifest) — an
       already-installed home-screen shortcut has no page load to pick up a
       new versioned URL after a future deploy, so the manifest's own
       address must never change. Its icon URLs inside are still versioned,
       so a rebuild still cache-busts them like every other static asset. -->
  <link rel="manifest" href="/static/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/static/v{{.AssetVersion}}/brand/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Miranda" />
  <meta name="mobile-web-app-capable" content="yes" />
</head>
<!-- h-[var(--app-height,100dvh)] (not h-full/height:100%) is load-bearing
     here: with viewport-fit=cover, WKWebView's percentage-height chain
     (html{height:100%} -> body{height:100%} -> the flex div below) resolves
     against a containing block that's short by exactly the top safe-area
     inset in standalone PWA mode — a real WebKit quirk that left the
     composer's own bottom safe-area padding correct but sitting on top of
     an extra unstyled gap the height of the *top* inset, since the whole
     column of content (header+main) was that much too short. --app-height
     (set by the inline script above, falling back to 100dvh before it's run)
     is tied to a direct JS measurement of the real viewport instead of
     being propagated through ancestor percentages or CSS's own dvh
     calculation, so it doesn't have that gap or that calculation's timing
     quirk. -->
<body class="h-[var(--app-height,100dvh)] bg-(--color-bg) text-(--color-text) antialiased">
  <a href="#app" class="sr-only focus-visible:not-sr-only focus-visible:fixed focus-visible:left-4 focus-visible:top-4 focus-visible:z-50 focus-visible:rounded-lg focus-visible:bg-(--color-accent) focus-visible:px-4 focus-visible:py-2 focus-visible:text-sm focus-visible:font-medium focus-visible:text-white">
    {{.Strings.skip_to_content}}
  </a>

  <div class="flex h-full flex-col">
    <!-- pt-[env(safe-area-inset-top)]: same reasoning as the composer's
         bottom safe-area padding in screens/chat.js, but for the
         other edge — viewport-fit=cover (index.html's <head>) makes the
         whole document draw under the iOS status bar/notch in a standalone
         PWA, not just the home-indicator area at the bottom, so the header
         needs its own inset or its content sits behind the notch. Padding
         (not margin) so the header's own background/blur still fills the
         notch area instead of leaving it showing the page background. -->
    <header class="relative z-40 border-b border-(--color-border) bg-(--color-bg)/80 pt-[env(safe-area-inset-top)] backdrop-blur supports-[backdrop-filter]:bg-(--color-bg)/60">
      <div class="mx-auto flex max-w-7xl items-center justify-between gap-3 px-4 py-3 sm:px-6">
        <a href="#/chat" class="flex items-center gap-2.5 rounded-lg py-1 transition-opacity hover:opacity-80">
          <img src="/static/v{{.AssetVersion}}/brand/icon.svg" alt="" class="h-8 w-8 rounded-full ring-2 ring-(--color-border-strong)" />
          <span class="text-base font-semibold tracking-tight text-(--color-text)">Miranda</span>
        </a>

        <nav id="nav-links" aria-label="{{.Strings.nav_primary_label}}" class="hidden items-center gap-1 text-sm sm:flex"></nav>

        <div class="flex items-center gap-2 sm:gap-3">
          <div class="flex items-center gap-2 rounded-full border border-(--color-border) bg-(--color-surface)/40 px-2.5 py-1.5 sm:px-3">
            <span id="ws-dot" class="h-2 w-2 shrink-0 animate-pulse-soft rounded-full bg-(--color-text-faint)" title="{{.Strings.ws_connecting}}"></span>
            <span id="ws-status" class="hidden text-xs font-medium text-(--color-text-muted) md:inline">{{.Strings.ws_connecting}}</span>
          </div>

          <div class="hidden items-center gap-0.5 rounded-full border border-(--color-border) bg-(--color-surface)/40 p-0.5 text-xs lg:flex">
            {{range .Languages}}
            <a href="/set-lang?lang={{.Code}}&next=/" class="rounded-full px-2.5 py-1 font-medium transition-colors {{if .Active}}bg-(--color-surface-2) text-(--color-text){{else}}text-(--color-text-faint) hover:text-(--color-text-muted){{end}}">{{.Label}}</a>
            {{end}}
          </div>

          <button id="theme-toggle" type="button"
                  class="inline-flex h-11 w-11 items-center justify-center rounded-lg text-(--color-text-muted) transition-colors hover:bg-(--color-surface-2) hover:text-(--color-text) focus-visible:outline-none">
          </button>

          <a href="#/profile" class="hidden min-h-11 items-center gap-2 rounded-full pl-1 pr-3 text-sm transition-colors hover:bg-(--color-surface-2) sm:flex">
            {{if .User.Avatar}}
            <img src="{{.User.Avatar}}" alt="" class="h-7 w-7 rounded-full object-cover ring-1 ring-(--color-border)" />
            {{else}}
            <span class="flex h-7 w-7 items-center justify-center rounded-full bg-(--color-surface-2) text-(--color-text-faint)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
            </span>
            {{end}}
            <span class="font-medium text-(--color-text)">{{.User.DisplayName}}</span>
          </a>

          <button id="nav-burger" type="button"
                  class="inline-flex h-11 w-11 items-center justify-center rounded-lg text-(--color-text-muted) transition-colors hover:bg-(--color-surface-2) hover:text-(--color-text) focus-visible:outline-none sm:hidden"
                  aria-label="{{.Strings.nav_menu_toggle}}" aria-expanded="false" aria-controls="nav-drawer">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5">
              <path d="M3.75 6.75h16.5M3.75 12h16.5M3.75 17.25h16.5" />
            </svg>
          </button>
        </div>
      </div>

      <div id="nav-drawer"
           class="drawer-closed absolute inset-x-0 top-full flex origin-top flex-col gap-4 border-b border-(--color-border) bg-(--color-bg)/95 p-4 shadow-xl shadow-black/10 backdrop-blur transition-[opacity,transform] duration-200 ease-out sm:hidden"
           role="menu" aria-hidden="true">
        <nav id="nav-links-mobile" aria-label="{{.Strings.nav_primary_label}}" class="flex flex-col gap-1 text-sm"></nav>
        <div class="flex items-center gap-4 border-t border-(--color-border) pt-4 text-xs text-(--color-text-faint)">
          {{range .Languages}}
          <a href="/set-lang?lang={{.Code}}&next=/" class="font-medium {{if .Active}}text-(--color-text){{else}}hover:text-(--color-text-muted){{end}}">{{.Label}}</a>
          {{end}}
        </div>
        <form method="POST" action="/logout">
          <button type="submit" class="flex w-full items-center gap-2 rounded-lg border border-(--color-border) px-3 py-2.5 text-left text-sm font-medium text-(--color-text-muted) transition-colors hover:border-(--color-danger-border) hover:bg-(--color-danger-bg) hover:text-(--color-danger-text)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            {{.Strings.logout_button}}
          </button>
        </form>
      </div>
    </header>

    <main id="app" tabindex="-1" class="min-h-0 flex-1 overflow-hidden focus:outline-none"></main>
  </div>

  <script>
    window.MIRANDA_I18N = {{.StringsJSON}};
    window.MIRANDA_USER = {{.UserJSON}};
    window.MIRANDA_WEBAUTHN_ENABLED = {{.WebAuthnEnabled}};
  </script>
  <script type="module" src="/static/v{{.AssetVersion}}/js/app.js"></script>
</body>
</html>
