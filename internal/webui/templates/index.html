<!doctype html>
<html lang="{{.Lang}}" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Miranda</title>
  <link rel="icon" type="image/svg+xml" href="/static/brand/icon.svg" />
  <link rel="alternate icon" type="image/png" href="/static/brand/icon.png" />
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body class="h-full bg-slate-950 text-slate-100 antialiased">
  <div class="flex h-full flex-col">
    <header class="border-b border-slate-800 px-4 py-3 sm:px-6">
      <div class="flex items-center justify-between gap-4">
        <div class="flex items-center gap-2">
          <img src="/static/brand/icon.svg" alt="" class="h-8 w-8 rounded-full" />
          <span class="text-lg font-semibold tracking-tight">Miranda</span>
        </div>

        <nav id="nav-links" class="hidden items-center gap-1 text-sm sm:flex"></nav>

        <div class="flex items-center gap-3">
          <div class="flex items-center gap-2">
            <span id="ws-dot" class="h-2.5 w-2.5 rounded-full bg-slate-600" title="{{.Strings.ws_connecting}}"></span>
            <span id="ws-status" class="hidden text-xs text-slate-400 md:inline">{{.Strings.ws_connecting}}</span>
          </div>
          <div class="hidden items-center gap-2 text-xs text-slate-500 lg:flex">
            {{range .Languages}}
            <a href="/set-lang?lang={{.Code}}&next=/" class="{{if .Active}}text-slate-200{{else}}hover:text-slate-300{{end}}">{{.Label}}</a>
            {{end}}
          </div>
          <a href="#/profile" class="hidden items-center gap-2 sm:flex">
            {{if .User.Avatar}}<img src="{{.User.Avatar}}" alt="" class="h-7 w-7 rounded-full object-cover" />{{end}}
            <span class="text-slate-300">{{.User.DisplayName}}</span>
          </a>
          <button id="nav-burger" type="button" class="rounded-md border border-slate-700 p-1.5 text-slate-300 hover:bg-slate-800 sm:hidden" aria-label="Menu" aria-expanded="false">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-5 w-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5M3.75 17.25h16.5" />
            </svg>
          </button>
        </div>
      </div>

      <div id="nav-drawer" class="mt-3 hidden flex-col gap-3 border-t border-slate-800 pt-3 sm:hidden">
        <nav id="nav-links-mobile" class="flex flex-col gap-1 text-sm"></nav>
        <div class="flex items-center gap-3 text-xs text-slate-500">
          {{range .Languages}}
          <a href="/set-lang?lang={{.Code}}&next=/" class="{{if .Active}}text-slate-200{{else}}hover:text-slate-300{{end}}">{{.Label}}</a>
          {{end}}
        </div>
        <form method="POST" action="/logout">
          <button type="submit" class="w-full rounded-md border border-slate-700 px-3 py-2 text-left text-sm text-slate-300 hover:bg-slate-800">
            {{.Strings.logout_button}}
          </button>
        </form>
      </div>
    </header>

    <main id="app" class="min-h-0 flex-1 overflow-hidden"></main>
  </div>

  <script>
    window.MIRANDA_I18N = {{.StringsJSON}};
    window.MIRANDA_USER = {{.UserJSON}};
    window.MIRANDA_WEBAUTHN_ENABLED = {{.WebAuthnEnabled}};
  </script>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
